version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it, so a compromised or broken version is
    # usually caught and withdrawn first (the same rule as min-release-age in .npmrc).
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # SheetJS is vendored from its own CDN (see vendor/README.md); the npm registry copy is older.
      - dependency-name: xlsx
      # typescript-eslint supports TypeScript only up to the version range in its peer dependency
      # (currently below 6.1): raise TypeScript by hand together with typescript-eslint.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # The types follow the Node major the project targets (.nvmrc, CI), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
